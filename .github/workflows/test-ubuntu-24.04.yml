name: install on Ubuntu

on:
  push:
  workflow_dispatch:

jobs:
  install:
    name: install on Ubuntu ${{ matrix.ubuntu-version }}
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: [22.04, 24.04]
    steps:
      - uses: actions/checkout@v4
      - name: install Xvfb
        run: sudo apt-get install -y xvfb
      - name: install
        run: ./install.sh
      - name: smoke test
        run: xvfb-run --auto-servernum claude-desktop --debug
      - name: dump startup log
        if: always()
        run: cat /home/runner/.local/state/claude-cowork/logs/startup.log

