name: install on Ubuntu

on:
  push:
  workflow_dispatch:

jobs:
  install:
    name: install on Ubuntu ${{ matrix.ubuntu-version }}
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: [22.04, 24.04]
    steps:
      - uses: actions/checkout@v4
      - name: install Xvfb
        run: sudo apt-get install -y xvfb
      - name: install
        run: ./install.sh
      - name: overlay local checkout
        run: |
          # install.sh clones from GitHub; override with the branch under test
          rsync -a --exclude=linux-app-extracted ./ ~/.local/share/claude-desktop/
      - name: smoke test
        run: |
          timeout 15 xvfb-run --auto-servernum claude-desktop --devtools 2>&1 | tee /tmp/smoke.log || true
      - name: dump logs
        if: always()
        run: |
          echo "=== smoke test output ==="
          cat /tmp/smoke.log || echo "(no smoke output captured)"
          echo "=== startup.log ==="
          cat /home/runner/.local/state/claude-cowork/logs/startup.log 2>/dev/null || echo "(startup.log missing or empty)"
          echo "=== log dir listing ==="
          ls -la /home/runner/.local/state/claude-cowork/logs/ 2>/dev/null || echo "(log dir not found)"
      - name: check for errors
        if: always()
        run: |
          if grep -iqE '\berror\b|fatal|exception|ENOENT|segfault' /tmp/smoke.log /home/runner/.local/state/claude-cowork/logs/startup.log 2>/dev/null; then
            echo "::error::Errors found in startup.log"
            grep -inE '\berror\b|fatal|exception|ENOENT|segfault' /tmp/smoke.log /home/runner/.local/state/claude-cowork/logs/startup.log 2>/dev/null
            exit 1
          fi
          echo "No errors found in startup.log"
